name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Skip drafts and PRs from forks (forked PRs can't read the secret anyway).
jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for quest-master, a persistent text-RPG
            engine exposed as an MCP server. Focus on:
            - Correctness bugs and unhandled edge cases, especially in game
              state transitions and persistence
            - MCP protocol usage: tool/resource/prompt definitions, schemas,
              sampling and elicitation flows
            - Python quality: typing, error handling, and adherence to the
              patterns already in the codebase
            - Test coverage for the changed behaviour (pytest)
            - Security and input validation for anything reading untrusted input

            Keep feedback concrete and scoped to the diff. If the change looks
            good, say so briefly rather than inventing nitpicks.

            Note: the PR branch is already checked out in the working directory.
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific line-level issues.
            Only post GitHub comments - don't return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
